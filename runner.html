<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aether3D Studio - Runner</title>
    <!-- Importação dos scripts oficiais do Gradio Lite -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/@gradio/lite/dist/lite.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gradio/lite/dist/lite.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1b2a;
            font-family: system-ui, -apple-system, sans-serif;
            color: white;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            background: linear-gradient(90deg, #38bdf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Aether3D Studio Runner</h1>
        <p>Ambiente de Execução Gradio via WebAssembly</p>
    </header>

    <!-- Componente Gradio Lite -->
    <gradio-lite>
        <!-- Pacotes Pyodide/WebAssembly baseados no seu requirements.txt -->
        <gradio-requirements>
            gradio
            trimesh
            numpy
            Pillow
            scipy
        </gradio-requirements>

        <!-- Carrega o script principal diretamente -->
        <gradio-file name="app_gui.py" entrypoint url="./app_gui.py"></gradio-file>
    </gradio-lite>
</div>

</body>
</html>
