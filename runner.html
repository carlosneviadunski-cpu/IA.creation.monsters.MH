<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runner Python - Gerador de Monstros</title>
    <!-- Imports do PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>
<body>

    <div class="card">
        <h2>🐉 Criador de Monstros (Runner HTML)</h2>
        
        <label for="nome">Nome do Monstro:</label>
        <input type="text" id="nome" value="Ignisdrake">

        <label for="estrutura">Estrutura:</label>
        <input type="text" id="estrutura" value="Quadrúpede escamado">

        <label for="poder">Poder:</label>
        <input type="text" id="poder" value="Sopro de Impacto">

        <label for="ambiente">Ambiente:</label>
        <select id="ambiente">
            <option value="Vulcão">Vulcão</option>
            <option value="Pico Gelado">Pico Gelado</option>
            <option value="Pantano">Pântano</option>
        </select>

        <button id="btn-gerar">Analisar e Gerar</button>

        <div id="output">O resultado da análise aparecerá aqui...</div>
    </div>

    <script type="py" config='{"interpreter": "pyodide"}'>
        from pyscript import document
        from pyodide.ffi import create_proxy

        def executar_gerador(event=None):
            nome = document.getElementById("nome").value
            estrutura = document.getElementById("estrutura").value
            poder = document.getElementById("poder").value
            ambiente = document.getElementById("ambiente").value

            dietas = {
                "Vulcão": "Carnívoro/Litófago (consome minérios e enxofre).",
                "Pico Gelado": "Carnívoro (caçador com isolamento térmico).",
                "Pantano": "Detritívoro/Tóxico (assimila venenos)."
            }
            dieta = dietas.get(ambiente, "Adaptável ao ecossistema.")

            resultado = (
                f"🧬 ANÁLISE BIOLÓGICA DE {nome.upper()}\n\n"
                f"• Dieta: {dieta}\n"
                f"• Estrutura: {estrutura}\n"
                f"• Habilidade: {poder}\n"
                f"• Habitat: {ambiente}"
            )

            document.getElementById("output").innerText = resultado

        btn = document.getElementById("btn-gerar")
        btn.addEventListener("click", create_proxy(executar_gerador))
    </script>

</body>
</html>
